server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: cyberguard-platform
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/cyberguard_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:c2VjdXJlLWNoYW5nZS10aGlzLXNlY3JldC1rZXktZm9yLWp3dC1zaWduaW5nLWluLXByb2R1Y3Rpb24tZW52aXJvbm1lbnQ=}
    access-token-expiration-ms: ${JWT_ACCESS_EXP:900000}        # 15 minutes
    refresh-token-expiration-ms: ${JWT_REFRESH_EXP:604800000}  # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  response:
    # Toggles ResponseActionService.handleThreatResponse() between the RL-based
    # autoRespondAdaptive() (Q-learning policy) and the original static
    # autoRespond() playbook. Falls back to autoRespond() automatically if the
    # AI service is unreachable, regardless of this flag.
    adaptive-mode-enabled: ${ADAPTIVE_RESPONSE_ENABLED:false}

ai-service:
  base-url: ${AI_SERVICE_URL:http://localhost:8000}

management:
  endpoint:
    health:
      access: unrestricted
  health:
    # MAIL_USERNAME/MAIL_PASSWORD are documented as optional (critical-alert emails
    # only). Without this, Actuator's auto-configured mail health indicator tries to
    # authenticate to SMTP and fails, dragging the whole /actuator/health aggregate to
    # DOWN - which would make the Render health check (and any load balancer) treat an
    # otherwise-healthy instance as unhealthy forever.
    mail:
      enabled: false

logging:
  level:
    root: INFO
    com.cyberguard.platform: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
