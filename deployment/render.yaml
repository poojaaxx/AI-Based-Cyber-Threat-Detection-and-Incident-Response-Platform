# Render.com Blueprint - deploys the Spring Boot backend and FastAPI AI service.
# Frontend is deployed separately to Vercel (see deployment/vercel.json).
#
# Usage: connect this repo in the Render dashboard as a "Blueprint" and it will
# provision both services + a managed MySQL-compatible database automatically.

services:
  - type: web
    name: cyberguard-backend
    runtime: docker
    # Both paths are relative to the repo root (Render docs). A leading "./" here
    # previously produced "open Dockerfile: no such file or directory" during the
    # build - matching the docs' own no-leading-dot-slash form resolves it.
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: cyberguard-ai-service
          property: hostport
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: cyberguard-ai-service
    runtime: docker
    dockerfilePath: ai-service/Dockerfile
    dockerContext: ai-service
    plan: free
    healthCheckPath: /health
    envVars:
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
